name: places_catalog
description: 'PlacesCatalog — your personal culinary & culture diary (Lab 3, UI without business logic).'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # UI-only: renders the custom icons exported from Figma as SVG.
  flutter_svg: ^2.3.0
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  firebase_analytics: ^12.6.1
  firebase_crashlytics: ^5.4.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  cloud_firestore: ^6.10.2
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  cached_network_image: ^4.0.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  dio: ^5.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
